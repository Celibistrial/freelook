name: Publish

# Fully automatic: publishes whenever gradle.properties lands on master with a
# mod_version that has not been released yet (e.g. after the auto-update PR is
# merged). Each destination is guarded on its own, so re-running after a partial
# failure (Modrinth 500s once CurseForge has already accepted the file) resumes
# where it stopped instead of uploading a duplicate.
on:
  push:
    branches: [master]
    paths:
      - gradle.properties
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the version tag + GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to detect already-published versions

      - name: Read versions
        id: vars
        run: |
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "mod=$MOD" >> $GITHUB_OUTPUT
          echo "mc=$MC" >> $GITHUB_OUTPUT
          echo "tag=v$MOD" >> $GITHUB_OUTPUT

      - name: Work out what still needs publishing
        id: todo
        run: |
          MOD="${{ steps.vars.outputs.mod }}"

          # Modrinth lists published versions publicly, so ask it directly.
          # A failed curl aborts the step rather than risking a duplicate upload.
          VERSIONS=$(curl -sf --retry 3 "https://api.modrinth.com/v2/project/freelook/version")
          if jq -e --arg v "$MOD" 'any(.[]; .version_number == $v)' <<<"$VERSIONS" >/dev/null; then
            MODRINTH=false
          else
            MODRINTH=true
          fi

          # CurseForge's upload API has no "list my files" endpoint, so record a
          # successful upload with a marker tag and use that tag as the guard.
          git rev-parse "refs/tags/curseforge/$MOD" >/dev/null 2>&1 && CURSEFORGE=false || CURSEFORGE=true

          git rev-parse "refs/tags/v$MOD" >/dev/null 2>&1 && RELEASE=false || RELEASE=true

          echo "modrinth=$MODRINTH" >> $GITHUB_OUTPUT
          echo "curseforge=$CURSEFORGE" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

          if [ "$MODRINTH$CURSEFORGE$RELEASE" = "falsefalsefalse" ]; then
            echo "any=false" >> $GITHUB_OUTPUT
            echo "$MOD is already on Modrinth, CurseForge and GitHub. Nothing to do."
          else
            echo "any=true" >> $GITHUB_OUTPUT
            echo "Still to publish for $MOD: modrinth=$MODRINTH curseforge=$CURSEFORGE release=$RELEASE"
          fi

      - name: Set up Java
        if: steps.todo.outputs.any == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        if: steps.todo.outputs.any == 'true'
        run: ./gradlew build --no-daemon

      - name: Publish to CurseForge
        if: steps.todo.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: Freelook ${{ steps.vars.outputs.mod }} for ${{ steps.vars.outputs.mc }}
          version: ${{ steps.vars.outputs.mod }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.vars.outputs.mc }}
          dependencies: |
            fabric-api
          files: build/libs/!(*-sources).jar

      - name: Mark CurseForge as published
        if: steps.todo.outputs.curseforge == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "curseforge/${{ steps.vars.outputs.mod }}"
          git push origin "curseforge/${{ steps.vars.outputs.mod }}"

      - name: Publish to Modrinth
        if: steps.todo.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: freelook
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: Freelook ${{ steps.vars.outputs.mod }} for ${{ steps.vars.outputs.mc }}
          version: ${{ steps.vars.outputs.mod }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.vars.outputs.mc }}
          dependencies: |
            fabric-api
          files: build/libs/!(*-sources).jar

      - name: Tag and GitHub release
        if: steps.todo.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -vE '(-sources|-dev|-shadow)\.jar$' | head -1)
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"
          gh release create "${{ steps.vars.outputs.tag }}" \
            --title "Freelook ${{ steps.vars.outputs.mod }} (MC ${{ steps.vars.outputs.mc }})" \
            --notes "Automated release for Minecraft ${{ steps.vars.outputs.mc }}." \
            "$JAR"
